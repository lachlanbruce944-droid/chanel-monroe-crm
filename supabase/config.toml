# Public website application endpoint; input is validated inside the function.
[functions.application]
verify_jwt = false

# The function validates the bearer token and owner role itself (supports publishable keys).
[functions.consultation-manage]
verify_jwt = false

[functions.crm-connectors]
verify_jwt = false

# Authenticated staff requests or verified Stripe webhook signatures are checked in the function.
[functions.crm-stripe]
verify_jwt = false
